# Example Docker Compose service. Host networking lets the bridge reach the
# nodes and lets Home Assistant connect to the voice satellites (TCP 10700+).
services:
  a2dp-relay-bridge:
    image: ghcr.io/sl1288/a2dp-relay-bridge:latest
    container_name: a2dp-relay-bridge
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./data:/data   # bridge.yaml goes here; the bridge writes state.json
